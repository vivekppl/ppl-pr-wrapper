<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PPL PR</title>

  <meta name="theme-color" content="#1d4ed8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PPL PR">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-512.png">

  <style>
    :root{
      --brand:#1d4ed8;
      --bg:#e9edf5;
      --text:#0f172a;
      --bar:#0f1720;
      --shadow:0 10px 30px rgba(0,0,0,.12);
      --radius:18px;
      --header-h:56px;
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:100dvh;
      color:var(--text);
      overscroll-behavior:none;
      touch-action:manipulation;
    }

    .app{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      min-height:100dvh;
      background:var(--bg);
    }

    .topbar{
      height:var(--header-h);
      background:var(--bar);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      padding:8px 12px;
      gap:10px;
      box-shadow:0 2px 10px rgba(0,0,0,.15);
      z-index:20;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .brand img{
      height:30px;
      width:auto;
      display:block;
      object-fit:contain;
      background:#fff;
      border-radius:4px;
      padding:0;
    }

    .brand-text{
      font-weight:800;
      letter-spacing:.3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      display:none;
    }

    .main{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:linear-gradient(180deg,#eef2ff 0%, #e9edf5 100%);
    }

    .card{
      width:min(520px, 100%);
      background:#fff;
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:24px;
      text-align:center;
    }

    .title{
      margin:0;
      font-size:clamp(28px, 6vw, 42px);
      line-height:1.05;
      font-weight:900;
      color:#0b1736;
    }

    .sub{
      margin:12px 0 20px;
      color:#6b7280;
      font-size:15px;
    }

    .actions{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .primary{
      appearance:none;
      border:0;
      border-radius:16px;
      padding:14px 16px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
      background:var(--brand);
      color:#fff;
    }

    @media (min-width: 700px){
      .brand-text{ display:block; }
      .topbar{ padding:10px 18px; }
      .brand img{ height:34px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="/projenix-logo.png" alt="Projenix">
        <div class="brand-text">PPL Purchase Requisition</div>
      </div>
    </header>

    <main class="main">
      <div class="card">
        <h1 class="title">PPL Purchase<br>Requisition</h1>
        <div class="sub">Mobile-first access to the live PR system.</div>

        <div class="actions">
          <button class="primary" id="launchBtn" type="button">Open PPL PR</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const TARGET = "https://script.google.com/macros/s/AKfycbyqrQhcAiDYKHMh5EfMkrIpLFvu8XVeHaNbbRsTZ6GedAtgIYJLls_JZAw6uQElT1Ro3g/exec";
    document.getElementById('launchBtn').addEventListener('click', function(){
      window.location.href = TARGET;
    });
  </script>
</body>
</html>
